<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" width="940" height="720" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="720" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">DeepSeek-V4.1-Flash: where the 890 bytes/token comes from</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Split the stack at L/2, derive every decoder KV from one encoder state, then share and quantize what is left</text>
  <rect x="22" y="68" width="896" height="164" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#6d28d9" font-weight="700">CAUSAL ENCODER-DECODER — 40 layers cut at L/2</text>
  <rect x="38" y="104" width="300" height="96" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="188" y="126" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">Causal Encoder — 20 layers</text>
  <text x="188" y="148" text-anchor="middle" font-size="10" fill="#475569">L1-2:  pure SWA, n_win = 128</text>
  <text x="188" y="164" text-anchor="middle" font-size="10" fill="#475569">L3-20:  CSA2 with m = 2</text>
  <text x="188" y="180" text-anchor="middle" font-size="10" fill="#475569">3 blocks of [ 1 Full + 5 Reuse ]</text>
  <rect x="538" y="104" width="300" height="96" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="688" y="126" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">Decoder — 20 layers</text>
  <text x="688" y="148" text-anchor="middle" font-size="10" fill="#475569">CSA2 with m = 1</text>
  <text x="688" y="164" text-anchor="middle" font-size="10" fill="#475569">block 1:  [ 1 Full + 3 Reuse ]</text>
  <text x="688" y="180" text-anchor="middle" font-size="10" fill="#475569">blocks 2-5:  [ 1 Reindex + 3 Reuse ]</text>
  <text x="438" y="134" text-anchor="middle" font-size="10.5" fill="#6d28d9" font-weight="700">H at layer L/2</text>
  <line x1="346" y1="150" x2="532" y2="150" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
  <text x="438" y="168" text-anchor="middle" font-size="10" fill="#475569">C_l = H W_l^KV</text>
  <text x="438" y="183" text-anchor="middle" font-size="10" fill="#475569">Z_l = H W_l^Z</text>
  <text x="438" y="198" text-anchor="middle" font-size="9.6" fill="#64748b">for every l &gt; L/2</text>
  <text x="38" y="216" font-size="10.4" fill="#6d28d9" font-weight="700">prefill O(N·L)  becomes  O(N·L/2 + n_win·L/2) ≈ O(N·L/2)</text>
  <text x="902" y="216" text-anchor="end" font-size="10.4" fill="#475569">8B params active per prefill token   ·   16B per decode token</text>
  <rect x="22" y="248" width="896" height="132" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="269" font-size="12.5" fill="#1d4ed8" font-weight="700">CSA2 — every layer is statically assigned one of three modes</text>
  <text x="42" y="292" font-size="9.8" fill="#64748b" font-weight="700">MODE</text>
  <text x="144" y="292" font-size="9.8" fill="#64748b" font-weight="700">MAIN KV</text>
  <text x="290" y="292" font-size="9.8" fill="#64748b" font-weight="700">INDEXER</text>
  <text x="472" y="292" font-size="9.8" fill="#64748b" font-weight="700">TOP-K INDICES</text>
  <line x1="38" y1="299" x2="902" y2="299" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <rect x="38" y="306" width="74" height="19" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="75" y="320" text-anchor="middle" font-size="10.2" fill="#047857" font-weight="700">Full</text>
  <text x="144" y="320" font-size="10" fill="#475569">compute fresh</text>
  <text x="290" y="320" font-size="10" fill="#475569">compute Q; project K from main KV</text>
  <text x="472" y="320" font-size="10" fill="#475569">score the whole visible context -&gt; fresh top-k</text>
  <rect x="38" y="333" width="74" height="19" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="75" y="347" text-anchor="middle" font-size="10.2" fill="#b45309" font-weight="700">Reindex</text>
  <text x="144" y="347" font-size="10" fill="#475569">reuse from Full</text>
  <text x="290" y="347" font-size="10" fill="#475569">compute Q only; reuse shared K</text>
  <text x="472" y="347" font-size="10" fill="#475569">rescore inside the candidate pool -&gt; fresh top-k</text>
  <rect x="38" y="360" width="74" height="19" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="75" y="374" text-anchor="middle" font-size="10.2" fill="#334155" font-weight="700">Reuse</text>
  <text x="144" y="374" font-size="10" fill="#475569">reuse, as above</text>
  <text x="290" y="374" font-size="10" fill="#475569">skipped entirely</text>
  <text x="472" y="374" font-size="10" fill="#475569">inherit the top-k of the Full/Reindex layer above</text>
  <rect x="22" y="396" width="552" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="38" y="417" font-size="12.5" fill="#047857" font-weight="700">HIERARCHICAL SPARSE INDEXER</text>
  <rect x="38" y="436" width="158.667" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="117.333" y="456" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="700">full context</text>
  <text x="117.333" y="472" text-anchor="middle" font-size="9.6" fill="#475569">N up to 1,000,000</text>
  <text x="117.333" y="486" text-anchor="middle" font-size="9.6" fill="#475569">causally visible</text>
  <line x1="199.667" y1="467" x2="215.667" y2="467" stroke="#059669" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a059669)"/>
  <rect x="218.667" y="436" width="158.667" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="298" y="456" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="700">decoder Full layer</text>
  <text x="298" y="472" text-anchor="middle" font-size="9.6" fill="#475569">top-512 token indices</text>
  <text x="298" y="486" text-anchor="middle" font-size="9.6" fill="#475569">top-2,048 blocks of 8</text>
  <line x1="380.333" y1="467" x2="396.333" y2="467" stroke="#059669" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a059669)"/>
  <rect x="399.333" y="436" width="158.667" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="478.667" y="456" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="700">shared candidate pool</text>
  <text x="478.667" y="472" text-anchor="middle" font-size="9.6" fill="#475569">16,384 positions</text>
  <text x="478.667" y="486" text-anchor="middle" font-size="9.6" fill="#475569">fixed, context-independent</text>
  <text x="38" y="518" font-size="10.2" fill="#475569">Reindex layers score only inside the pool, never across N:</text>
  <text x="38" y="534" font-size="10.2" fill="#047857" font-weight="700">indexer cost per deep layer goes from O(N) to O(1) in context length.</text>
  <rect x="592" y="396" width="326" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="608" y="417" font-size="12.5" fill="#b45309" font-weight="700">GLOBAL KV IN HBM</text>
  <rect x="608" y="436" width="91.3333" height="52" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="653.667" y="463.04" text-anchor="middle" font-size="13.5" fill="#b45309" font-weight="700">389,120</text>
  <text x="653.667" y="479" text-anchor="middle" font-size="9.3" fill="#64748b">DeepSeek-V1</text>
  <rect x="709.333" y="436" width="91.3333" height="52" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="755" y="463.04" text-anchor="middle" font-size="13.5" fill="#b45309" font-weight="700">3,514</text>
  <text x="755" y="479" text-anchor="middle" font-size="9.3" fill="#64748b">V4-Flash</text>
  <rect x="810.667" y="436" width="91.3333" height="52" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="856.333" y="463.04" text-anchor="middle" font-size="13.5" fill="#b45309" font-weight="700">890</text>
  <text x="856.333" y="479" text-anchor="middle" font-size="9.3" fill="#64748b">V4.1-Flash</text>
  <text x="608" y="508" font-size="10" fill="#475569">bytes per token  ·  1/437 of V1  ·  1/4 of V4-Flash</text>
  <text x="608" y="526" font-size="10" fill="#b45309" font-weight="700">persistent SSD: 1/2 (no SWA) × 1/4 (global KV) = 1/8</text>
  <rect x="22" y="562" width="286.667" height="112.06" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165.333" y="582.97" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">MXFP4 main KV</text>
  <text x="165.333" y="600.97" text-anchor="middle" font-size="10.3" fill="#475569">QAT to E2M1 with one E4M3 scale per 16 channels, no</text>
  <text x="165.333" y="615.47" text-anchor="middle" font-size="10.3" fill="#475569">NVFP4 global scale: RMSNorm plus orthogonal RoPE</text>
  <text x="165.333" y="629.97" text-anchor="middle" font-size="10.3" fill="#475569">bound the largest channel magnitude by sqrt(512) ≈ 22.6</text>
  <text x="165.333" y="644.47" text-anchor="middle" font-size="10.3" fill="#475569">(observed ≈ 10) against an E2M1 reach of 448 × 6 =</text>
  <text x="165.333" y="658.97" text-anchor="middle" font-size="10.3" fill="#475569">2,688.</text>
  <rect x="326.667" y="562" width="286.667" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="584.19" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">SWA bounded replay</text>
  <text x="470" y="602.19" text-anchor="middle" font-size="10.3" fill="#475569">Replay the last n_win = 128 tokens instead of</text>
  <text x="470" y="616.69" text-anchor="middle" font-size="10.3" fill="#475569">reconstructing L × n_win. Encoder SWA KV leaves SSD</text>
  <text x="470" y="631.19" text-anchor="middle" font-size="10.3" fill="#475569">for a 10% DRAM pool on a minute-scale TTL; decoder</text>
  <text x="470" y="645.69" text-anchor="middle" font-size="10.3" fill="#475569">prefill shrinks to n_win tokens.</text>
  <rect x="631.333" y="562" width="286.667" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="774.667" y="584.19" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">Single-pass mHC</text>
  <text x="774.667" y="602.19" text-anchor="middle" font-size="10.3" fill="#475569">Mix the input with A from the previous block so each tile</text>
  <text x="774.667" y="616.69" text-anchor="middle" font-size="10.3" fill="#475569">of X_l is read once. Activation traffic drops from (4n+4)d</text>
  <text x="774.667" y="631.19" text-anchor="middle" font-size="10.3" fill="#475569">to the (2n+2)d lower bound in one fused Mega-mHC</text>
  <text x="774.667" y="645.69" text-anchor="middle" font-size="10.3" fill="#475569">kernel.</text>
  <text x="470" y="698.06" text-anchor="middle" font-size="11" fill="#475569">552B total params, 196B of them conditional Engram memory  ·  1M-token multimodal context  ·  decode FLOPs per token flat from 4K to 1M</text>
  <defs>
    <marker id="a7c3aed" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#7c3aed"/></marker>
    <marker id="a059669" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#059669"/></marker>
  </defs>
</svg>
